<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Sunglass Simulator</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main class="camera-view">
    <video id="preview" autoplay muted playsinline></video>
    <div id="shade" class="shade" aria-hidden="true"></div>
    <div class="fake-glasses" aria-hidden="true"><i></i><i></i><b></b></div>

    <div class="top-bar"><span>SUNGLASS SIM</span><span id="recTag" class="rec-tag">● REC</span></div>
    <div id="message" class="message">Camera preview will appear here.</div>
    <div class="controls">
      <button id="cameraBtn" class="camera-btn">Start camera</button>
      <button id="shadesBtn" disabled>Put on sunglasses</button>
      <button id="metaBtn" class="record-btn" disabled>M3TA</button>
    </div>
    <p id="status" class="status" role="status">Allow camera access to begin.</p>
    <a id="download" hidden>Download recording</a>
  </main>
  <script src="app.js?v=4"></script>
</body>
</html>
